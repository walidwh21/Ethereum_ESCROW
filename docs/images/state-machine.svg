<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390"><rect width="900" height="390" rx="18" fill="#0b1220"/><text x="36" y="45" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">Contract state machine</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="130" width="190" height="68" rx="34" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="150" y="170" fill="#dbeafe" font-size="15" font-weight="700">AwaitingDeposit</text><rect x="355" y="130" width="150" height="68" rx="34" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="430" y="170" fill="#cffafe" font-size="15" font-weight="700">Funded</text><rect x="650" y="65" width="180" height="68" rx="34" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="740" y="105" fill="#dcfce7" font-size="15" font-weight="700">Released</text><rect x="650" y="235" width="180" height="68" rx="34" fill="#4c1d1d" stroke="#f87171" stroke-width="2"/><text x="740" y="275" fill="#fee2e2" font-size="15" font-weight="700">Refunded</text><path d="M245 164 H355" stroke="#94a3b8" stroke-width="2"/><path d="M347 157 L355 164 L347 171" stroke="#94a3b8" stroke-width="2" fill="none"/><text x="300" y="150" fill="#cbd5e1" font-size="13">deposit()</text><path d="M505 150 L570 100 H650" stroke="#94a3b8" stroke-width="2" fill="none"/><path d="M642 93 L650 100 L642 107" stroke="#94a3b8" stroke-width="2" fill="none"/><text x="575" y="83" fill="#bbf7d0" font-size="13">release()</text><path d="M505 180 L570 269 H650" stroke="#94a3b8" stroke-width="2" fill="none"/><path d="M642 262 L650 269 L642 276" stroke="#94a3b8" stroke-width="2" fill="none"/><text x="575" y="242" fill="#fecaca" font-size="13">refund()</text></g><text x="36" y="350" font-family="Arial,sans-serif" font-size="13" fill="#94a3b8">Terminal states cannot transition again. Invalid calls revert.</text></svg>