<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="1000" height="360" rx="18" fill="#0b1220"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">Timed escrow lifecycle</text><g font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><rect x="45" y="110" width="190" height="74" rx="12" fill="#172554" stroke="#60a5fa"/><text x="140" y="140" fill="#dbeafe" font-weight="700">Deploy</text><text x="140" y="163" fill="#bfdbfe" font-size="13">Set parties + deadline</text><path d="M235 147 H285" stroke="#94a3b8" stroke-width="2"/><path d="M277 140 L285 147 L277 154" fill="none" stroke="#94a3b8" stroke-width="2"/><rect x="285" y="110" width="190" height="74" rx="12" fill="#164e63" stroke="#22d3ee"/><text x="380" y="140" fill="#cffafe" font-weight="700">Deposit</text><text x="380" y="163" fill="#a5f3fc" font-size="13">Buyer locks ETH</text><path d="M475 147 H525" stroke="#94a3b8" stroke-width="2"/><path d="M517 140 L525 147 L517 154" fill="none" stroke="#94a3b8" stroke-width="2"/><rect x="525" y="110" width="190" height="74" rx="12" fill="#3f2b13" stroke="#fbbf24"/><text x="620" y="140" fill="#fef3c7" font-weight="700">Funded</text><text x="620" y="163" fill="#fde68a" font-size="13">Funds held by contract</text><path d="M715 147 H755 V103 H780" stroke="#94a3b8" stroke-width="2" fill="none"/><path d="M772 96 L780 103 L772 110" fill="none" stroke="#94a3b8" stroke-width="2"/><path d="M715 147 H755 V242 H780" stroke="#94a3b8" stroke-width="2" fill="none"/><path d="M772 235 L780 242 L772 249" fill="none" stroke="#94a3b8" stroke-width="2"/><rect x="780" y="70" width="175" height="66" rx="12" fill="#14532d" stroke="#4ade80"/><text x="867" y="98" fill="#dcfce7" font-weight="700">Release</text><text x="867" y="118" fill="#bbf7d0" font-size="12">Pay seller</text><rect x="780" y="210" width="175" height="66" rx="12" fill="#4c1d1d" stroke="#f87171"/><text x="867" y="238" fill="#fee2e2" font-weight="700">Refund</text><text x="867" y="258" fill="#fecaca" font-size="12">After deadline</text></g><text x="40" y="325" font-family="Arial,sans-serif" font-size="13" fill="#94a3b8">Release is buyer-approved. Refund is buyer-triggered after the configured deadline.</text></svg>